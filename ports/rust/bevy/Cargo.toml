[package]
name = "flappy_bevy"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
flappy_core = { path = "../core" }
bevy = { version = "0.20.1", default-features = false, features = [
  "std", "bevy_winit", "bevy_window", "default_app", "2d_bevy_render", "bevy_text", "default_font", "multi_threaded",
] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "com.flappydash.bevy"
apk_name = "flappy_bevy"
build_targets = ["aarch64-linux-android"]
resources = "../macroquad/android_res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Flappy Dash (Bevy)"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
orientation = "portrait"

[package.metadata.android.signing.release]
path = "../debug.keystore"
keystore_password = "android"
