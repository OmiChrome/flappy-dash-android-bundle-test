[package]
name = "flappy_dioxus"
version = "1.0.0"
edition = "2021"

[dependencies]
flappy_core = { path = "../core" }
# only the shared sound rules + .wav files; the page plays them with Web Audio
flappy_sfx = { path = "../sfx", default-features = false }
dioxus = { version = "0.7.10", features = [] }

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
