[package]
name = "flappy_sfx"
version = "1.0.0"
edition = "2021"
description = "Sound effects + vibration for the native Rust ports (same .wav files and rules as the Expo app)"

[dependencies]
flappy_core = { path = "../core" }
cpal = { version = "0.18", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
default = ["audio"]
# off for apps that bring their own audio (macroquad)
audio = ["dep:cpal"]
