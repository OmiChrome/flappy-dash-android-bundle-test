[package]
name = "flappy_sfx"
version = "1.0.0"
edition = "2021"
description = "Sound effects + vibration for the native Rust ports (same .wav files and rules as the Expo app)"

[dependencies]
flappy_core = { path = "../core" }

# no cpal on the web: the browser builds use HTML audio
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.18", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
default = ["audio"]
audio = ["dep:cpal"]
