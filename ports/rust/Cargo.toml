# One workspace for every Rust port: they share the game engine (core) and one build cache.
[workspace]
resolver = "2"
members = ["core", "sfx", "macroquad", "slint", "bevy", "dioxus", "uniffi", "crux"]
# Tauri pins a different webkit2gtk than Dioxus, so it keeps its own lockfile
exclude = ["tauri"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# web builds (Dioxus): wasm-bindgen needs the custom sections that `strip` removes
[profile.wasm-release]
inherits = "release"
strip = false
opt-level = "z"
