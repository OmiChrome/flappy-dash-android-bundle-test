name: Ports

# Builds every framework port for every target it supports and attaches the files to a release.
#   Actions -> Ports -> Run workflow (tag = an existing or new release tag)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the builds to (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag }}

jobs:
  # ---------------------------------------------------------------- Android (JVM)
  kotlin-compose:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ports/kotlin-compose } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: ./gradlew assembleRelease bundleRelease --no-daemon
      - run: |
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk ../../out/kotlin-compose-android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../out/kotlin-compose-android.aab
      - uses: actions/upload-artifact@v4
        with: { name: kotlin-compose, path: out/ }

  java-views:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ports/java-views } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: ./gradlew assembleRelease bundleRelease --no-daemon
      - run: |
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk ../../out/java-views-android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../out/java-views-android.aab
      - uses: actions/upload-artifact@v4
        with: { name: java-views, path: out/ }

  # ---------------------------------------------------------------- Flutter
  flutter-linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ports/flutter } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - run: flutter build web --release
      - run: flutter build linux --release
      - run: |
          o=../../out; mkdir -p $o
          for a in arm64-v8a armeabi-v7a x86_64; do cp build/app/outputs/flutter-apk/app-$a-release.apk $o/flutter-android-$a.apk; done
          cp build/app/outputs/flutter-apk/app-release.apk $o/flutter-android-universal.apk
          cp build/app/outputs/bundle/release/app-release.aab $o/flutter-android.aab
          (cd build/web && zip -qr ../../$o/flutter-web.zip .)
          (cd build/linux/x64/release/bundle && tar czf ../../../../../$o/flutter-linux-x64.tar.gz .)
      - uses: actions/upload-artifact@v4
        with: { name: flutter-linux, path: out/ }

  flutter-windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: ports/flutter, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build windows --release
      - run: mkdir -p ../../out && cd build/windows/x64/runner/Release && 7z a -tzip ../../../../../../../out/flutter-windows-x64.zip . > /dev/null
      - uses: actions/upload-artifact@v4
        with: { name: flutter-windows, path: out/ }

  flutter-apple:
    runs-on: macos-latest
    defaults: { run: { working-directory: ports/flutter } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter build macos --release
      - run: flutter build ios --release --no-codesign
      - run: |
          o=../../out; mkdir -p $o
          (cd build/macos/Build/Products/Release && zip -qry ../../../../../$o/flutter-macos.zip *.app)
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry $o/flutter-ios-device-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: flutter-apple, path: out/ }

  # ---------------------------------------------------------------- Rust (workspace: ports/rust)
  rust-android:
    strategy:
      fail-fast: false
      matrix:
        app: [macroquad, slint, bevy]
        abi:
          - { target: aarch64-linux-android, name: arm64-v8a }
          - { target: armv7-linux-androideabi, name: armeabi-v7a }
          - { target: x86_64-linux-android, name: x86_64 }
          - { target: i686-linux-android, name: x86 }
        exclude:
          # Skia (Slint's renderer) does not compile for 32-bit x86 Android
          - app: slint
            abi: { target: i686-linux-android, name: x86 }
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 'ports/rust/${{ matrix.app }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.abi.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ports/rust, key: '${{ matrix.app }}-${{ matrix.abi.name }}' }
      - name: Install packager
        run: |
          if [ ${{ matrix.app }} = macroquad ]; then cargo install --locked --git https://github.com/not-fl3/cargo-quad-apk; else cargo install --locked cargo-apk; fi
      - name: Build APK (${{ matrix.abi.name }})
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # throwaway debug key so the APK installs directly (same as Android Studio's debug builds)
          [ -f ../debug.keystore ] || keytool -genkeypair -keystore ../debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          sed -i 's/^build_targets = .*/build_targets = ["${{ matrix.abi.target }}"]/' Cargo.toml
          mkdir -p ../../../out
          if [ ${{ matrix.app }} = macroquad ]; then
            cargo quad-apk build --release
            cp ../target/android-artifacts/release/apk/flappy_dash.apk ../../../out/rust-android-${{ matrix.abi.name }}.apk
          else
            cargo apk build --release --lib
            cp ../target/release/apk/flappy_${{ matrix.app }}.apk ../../../out/rust-${{ matrix.app }}-android-${{ matrix.abi.name }}.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: 'rust-${{ matrix.app }}-${{ matrix.abi.name }}', path: out/ }

  rust-desktop-web:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: ports/rust, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'wasm32-unknown-unknown' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ports/rust }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev libxkbcommon-x11-0 libudev-dev libwayland-dev libfontconfig1-dev
      - run: cargo test --release -p flappy_core
      - run: cargo build --release -p flappy_dash -p flappy_slint -p flappy_bevy
      - run: |
          mkdir -p ../../out
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          cp target/release/flappy_dash$ext ../../out/rust-${{ matrix.name }}$ext
          cp target/release/flappy_slint$ext ../../out/rust-slint-${{ matrix.name }}$ext
          cp target/release/flappy_bevy$ext ../../out/rust-bevy-${{ matrix.name }}$ext
      - if: runner.os == 'Linux'
        run: |
          cargo build --release -p flappy_dash --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/flappy_dash.wasm macroquad/web/
          (cd macroquad/web && zip -qr ../../../../out/rust-web.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: 'rust-desktop-${{ matrix.name }}', path: out/ }

  rust-ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: ports/rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-ios,aarch64-apple-ios-sim' }
      - name: Build unsigned .app bundles (device + simulator)
        run: |
          mkdir -p ../../out
          for t in aarch64-apple-ios:device aarch64-apple-ios-sim:simulator; do
            cargo build --release -p flappy_dash --target ${t%%:*}
            app=FlappyDash.app; rm -rf $app; mkdir $app
            cp target/${t%%:*}/release/flappy_dash $app/
            cat > $app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>flappy_dash</string>
            <key>CFBundleIdentifier</key><string>com.flappydash.rust</string>
            <key>CFBundleName</key><string>Flappy Dash</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>UIRequiresFullScreen</key><true/>
          </dict></plist>
          PLIST
            if [ ${t##*:} = device ]; then mkdir -p Payload && rm -rf Payload/* && cp -R $app Payload/ && zip -qry ../../out/rust-ios-device-unsigned.ipa Payload
            else zip -qry ../../out/rust-ios-simulator.zip $app; fi
          done
      - uses: actions/upload-artifact@v4
        with: { name: rust-ios, path: out/ }

  # ---------------------------------------------------------------- Rust + Kotlin shells (UniFFI, Crux)
  rust-kotlin-shell:
    strategy:
      fail-fast: false
      matrix:
        app: [uniffi, crux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ports/rust, key: 'shell-${{ matrix.app }}' }
      - run: cargo install --locked cargo-ndk
      - name: Rust library for all 4 ABIs + Kotlin bindings
        working-directory: ports/rust
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../${{ matrix.app }}-android/app/src/main/jniLibs build --release -p flappy_${{ matrix.app }}
          cargo build -p flappy_${{ matrix.app }}
          cargo run -p flappy_${{ matrix.app }} --features cli --bin uniffi-bindgen -- generate --library target/debug/libflappy_${{ matrix.app }}.so --language kotlin --out-dir ../${{ matrix.app }}-android/app/src/main/java --no-format
      - name: APKs (one per ABI + universal)
        working-directory: 'ports/${{ matrix.app }}-android'
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../../out
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed 's/app-//; s/-release//')
            cp "$f" ../../out/rust-${{ matrix.app }}-android-$abi.apk
          done
          ls -la ../../out
      - uses: actions/upload-artifact@v4
        with: { name: 'rust-${{ matrix.app }}', path: out/ }

  # ---------------------------------------------------------------- Dioxus (WebView, RSX)
  rust-dioxus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,x86_64-linux-android,wasm32-unknown-unknown' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ports/rust, key: dioxus }
      - run: cargo install --locked dioxus-cli@0.7.10
      - name: Android APKs (arm64 + x86_64)
        working-directory: ports/rust/dioxus
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          [ -f ../debug.keystore ] || keytool -genkeypair -keystore ../debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          mkdir -p ../../../out
          for t in aarch64-linux-android:arm64-v8a x86_64-linux-android:x86_64; do
            dx bundle --platform android --release --target ${t%%:*}
            # dx makes an AAB; build the release APK from the Gradle project it generated
            (cd ../target/dx/flappy_dioxus/release/android/app && ./gradlew assembleRelease --no-daemon)
            apk=$(ls ../target/dx/flappy_dioxus/release/android/app/app/build/outputs/apk/release/*.apk | head -1)
            "$signer" sign --v4-signing-enabled false --ks ../debug.keystore --ks-pass pass:android --out ../../../out/rust-dioxus-android-${t##*:}.apk "$apk"
          done
      - name: Web build
        working-directory: ports/rust/dioxus
        run: |
          dx build --platform web --release
          (cd ../target/dx/flappy_dioxus/release/web/public && zip -qr "$GITHUB_WORKSPACE/out/rust-dioxus-web.zip" .)
      - uses: actions/upload-artifact@v4
        with: { name: rust-dioxus, path: out/ }

  # ---------------------------------------------------------------- Tauri v2 (WebView, Rust shell)
  rust-tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ports/rust/tauri, key: tauri }
      - run: bun install --frozen-lockfile
      - run: cd ports/rust/tauri && npm install
      - name: Web build for the WebView (Expo export)
        run: bun run export:web && rm -rf ports/rust/tauri/www && cp -r dist ports/rust/tauri/www
      - name: Android APKs (one per ABI)
        working-directory: ports/rust/tauri
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          # the web game calls navigator.vibrate(); the WebView only allows it with this permission
          grep -q android.permission.VIBRATE gen/android/app/src/main/AndroidManifest.xml || sed -i '0,/<application/s//<uses-permission android:name="android.permission.VIBRATE" \/>\n    <application/' gen/android/app/src/main/AndroidManifest.xml
          npx tauri android build --apk --split-per-abi
          [ -f ../debug.keystore ] || keytool -genkeypair -keystore ../debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          mkdir -p ../../../out
          # outputs/apk/<arch>/release/app-<arch>-release-unsigned.apk -> one file per CPU type
          for f in $(find gen/android/app/build/outputs/apk -name "*release*.apk"); do
            abi=$(basename "$(dirname "$(dirname "$f")")")
            case "$abi" in arm64) abi=arm64-v8a;; arm) abi=armeabi-v7a;; x86_64|x86|universal) ;; esac
            "$signer" sign --v4-signing-enabled false --ks ../debug.keystore --ks-pass pass:android --out ../../../out/rust-tauri-android-$abi.apk "$f"
          done
          ls -la ../../../out
      - uses: actions/upload-artifact@v4
        with: { name: rust-tauri, path: out/ }

  # ---------------------------------------------------------------- Capacitor (WebView shell)
  capacitor-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: bun install --frozen-lockfile
      - run: cd ports/capacitor && bun install && ./build-android.sh
      - uses: actions/upload-artifact@v4
        with: { name: capacitor-android, path: out/ }

  # ---------------------------------------------------------------- publish
  release:
    needs: [kotlin-compose, java-views, capacitor-android, rust-kotlin-shell, rust-dioxus, rust-tauri, flutter-linux, flutter-windows, flutter-apple, rust-android, rust-desktop-web, rust-ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Attach to release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p files && find dl -type f -exec cp {} files/ \;
          ls -la files
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" --title "Flappy Dash ${TAG#v}" --notes "Builds for every framework. See README for the comparison."
          rm -f files/*.idsig
          gh release upload "$TAG" files/* --clobber
          # remove signature side-files that older runs uploaded
          for n in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '\.idsig$|^rust-tauri-android-release\.apk$'); do gh release delete-asset "$TAG" "$n" -y; done
          {
            echo "| Port file | Size |"; echo "|---|---:|"
            for f in files/*; do printf '| `%s` | %s |\n' "$(basename "$f")" "$(numfmt --to=iec-i --suffix=B --format='%.1f' "$(stat -c%s "$f")")"; done
          } >> "$GITHUB_STEP_SUMMARY"
