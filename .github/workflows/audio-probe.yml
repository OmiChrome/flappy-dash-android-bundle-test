name: Audio + haptics probe

# Installs Android builds on an emulator WITH audio, taps a few flaps, and records whether each app
# created a sound player and asked for a vibration. Used to debug "no sound" reports from real phones.
on:
  workflow_dispatch:
    inputs:
      tag: { description: 'Release tag', required: true, default: 'v2.1.0' }

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: { TAG: '${{ github.event.inputs.tag }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Download APKs
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p apks
          gh release download "$TAG" --dir apks --pattern '*x86_64*.apk' --pattern 'kotlin-compose-android.apk' --pattern 'java-views-android.apk' --pattern 'capacitor-android.apk' || true
          ls -la apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          # the emulator action runs each script line on its own, so the loop lives in a file
          script: bash bench/audio-probe-all.sh bench/audio-plan.txt apks probe-out
      - name: Summary
        if: always()
        run: |
          { echo '| App | Sound player opened | Vibrations |'; echo '|---|---|---|'; cat probe-out/summary.md 2>/dev/null; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: audio-probe, path: probe-out }
