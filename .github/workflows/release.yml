name: Release

# Builds every Expo format and publishes them as one GitHub release.
#   push a tag `v*`            -> fresh EAS builds for every profile
#   Actions -> Run workflow    -> optionally reuse finished EAS builds (JSON map profile -> build id)
# Needs repo secret EXPO_TOKEN (expo.dev -> Account -> Access tokens).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
      reuse:
        description: 'Optional JSON {"profile": "eas-build-id"} to reuse finished EAS builds'
        required: false
        default: '{}'

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_NO_TELEMETRY: '1'
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  REUSE: ${{ github.event.inputs.reuse || '{}' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bunx expo lint
      - run: bunx expo-doctor

  eas:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: preview-arm64,   platform: android, file: expo-android-arm64-v8a.apk }
          - { profile: preview-armv7,   platform: android, file: expo-android-armeabi-v7a.apk }
          - { profile: preview-x86_64,  platform: android, file: expo-android-x86_64.apk }
          - { profile: ios-simulator,   platform: ios,     file: expo-ios-simulator.tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build on EAS (or reuse a finished build)
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Add the EXPO_TOKEN repo secret"; exit 1; }
          id=$(jq -r --arg p "${{ matrix.profile }}" '.[$p] // empty' <<<"$REUSE")
          if [ -n "$id" ]; then
            bunx eas-cli build:view "$id" --json > build.json
            jq '[.]' build.json > b.json && mv b.json build.json
          else
            bunx eas-cli build -p ${{ matrix.platform }} --profile ${{ matrix.profile }} --non-interactive --wait --json > build.json
          fi
          url=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl' build.json)
          test -n "$url" && [ "$url" != "null" ] || { cat build.json; echo "::error::no artifact"; exit 1; }
          mkdir -p out && curl -fsSL -o "out/${{ matrix.file }}" "$url"
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.profile }}', path: out/ }

  android-apk:
    # The two biggest APKs build on the GitHub runner: the universal one ran into EAS's 45-minute
    # free-tier limit, and 32-bit x86 stopped mid-compile there. Signed with the debug key.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: universal, archs: '',    minify: '0', file: expo-android-universal.apk }
          - { name: x86,       archs: 'x86', minify: '1', file: expo-android-x86.apk }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild -p android --no-install
        env: { EXPO_ANDROID_ARCHS: '${{ matrix.archs }}', EXPO_ANDROID_MINIFY: '${{ matrix.minify }}' }
      - run: cd android && ./gradlew assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g'
      - run: mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk out/${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with: { name: 'android-apk-${{ matrix.name }}', path: out/ }

  android-aab:
    # Play Store bundle, built on the GitHub runner (16 GB RAM). EAS's free worker ran out of memory in R8.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild -p android --no-install
        env: { EXPO_ANDROID_MINIFY: '1' }
      - run: cd android && ./gradlew bundleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g'
      - run: mkdir -p out && cp android/app/build/outputs/bundle/release/app-release.aab out/expo-android-playstore.aab
      - uses: actions/upload-artifact@v4
        with: { name: android-aab, path: out/ }

  ios-device-unsigned:
    # Unsigned device build, only to measure real iOS app size (no Apple account needed).
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild -p ios --no-install
      - run: cd ios && pod install
      - name: xcodebuild (Release, generic iOS device, no signing)
        run: |
          cd ios
          ws=$(ls -d *.xcworkspace | head -1); scheme=${ws%.xcworkspace}
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 30
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p Payload ../out && cp -R "$app" Payload/
          zip -qry ../out/expo-ios-device-unsigned.ipa Payload
          du -sh "$app" ../out/*.ipa
      - uses: actions/upload-artifact@v4
        with: { name: ios-device-unsigned, path: out/ }

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run export:web
      - run: mkdir -p out && cd dist && zip -qr ../out/expo-web.zip .
      - name: Deploy to EAS Hosting
        run: bunx eas-cli deploy --prod --non-interactive
      - uses: actions/upload-artifact@v4
        with: { name: web, path: out/ }

  release:
    needs: [eas, android-apk, android-aab, ios-device-unsigned, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Collect files and size table
        run: |
          mkdir -p files && find dl -type f -exec cp {} files/ \;
          {
            echo "## Downloads"
            echo
            echo "**Android phone (arm64, most phones): \`expo-android-arm64-v8a.apk\`**. Not sure? Use \`expo-android-universal.apk\`."
            echo
            echo "| File | Size |"
            echo "|---|---:|"
            for f in files/*; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(numfmt --to=iec-i --suffix=B --format='%.1f' "$(stat -c%s "$f")")"
            done
            echo
            echo "- \`.aab\` is for the Play Store; it can't be installed directly."
            echo "- \`expo-ios-simulator.tar.gz\` runs only in the Xcode iOS Simulator (macOS)."
            echo "- \`expo-ios-device-unsigned.ipa\` is unsigned. It shows real iOS app size but cannot be installed without signing."
            echo "- Web: https://flappy-dash.expo.app"
          } > notes.md
          cat notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" --title "Flappy Dash ${TAG#v}" --notes-file notes.md
          gh release edit "$TAG" --notes-file notes.md
          gh release upload "$TAG" files/* --clobber
